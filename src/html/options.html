<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Account Switcher - Pengaturan</title>
  <link rel="stylesheet" href="../css/options.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dashboard-container">
    <header class="header">
      <div class="logo">
        <img src="../../assets/images/icon.png" alt="Logo" width="48" height="48">
        <h1>Pengaturan Account Switcher</h1>
      </div>
      <div class="header-actions">
        <div class="theme-switcher" id="themeSwitcher">
          <button class="theme-btn active" data-theme-value="default" title="Sistem">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
          </button>
          <button class="theme-btn" data-theme-value="light" title="Terang">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </button>
          <button class="theme-btn" data-theme-value="dark" title="Gelap">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="section settings-section">
        <div class="section-header">
          <h2>Pengalihan Layanan Google</h2>
          <p>Tentukan akun mana yang akan terbuka secara otomatis untuk masing-masing layanan.</p>
        </div>
        
        <div class="services-grid" id="servicesGrid">
          <!-- Dinamis via JS -->
        </div>

        <div class="global-toggles">
          <label class="toggle-container large-toggle">
            <input type="checkbox" id="autoRedirect">
            <div class="checkbox-visual">
               <svg viewBox="0 0 24 24" width="16" height="16" stroke="white" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="label-text">
               <strong>Aktifkan Pengalihan Otomatis</strong>
               <span class="desc">Jika dimatikan, ekstensi tidak akan mengalihkan tautan layanan apapun.</span>
            </div>
          </label>
        </div>
      </section>

      <section class="section accounts-section">
         <div class="section-header">
            <h2>Akun Tersinkronisasi</h2>
            <button class="btn btn-primary" id="syncAccountsBtn">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
              <span>Sinkronisasi Ulang</span>
            </button>
         </div>
         <p>Berikut adalah daftar akun Google yang terdeteksi di browser Anda.</p>
         <div class="accounts-grid" id="accountsGrid">
           <!-- Dinamis via JS -->
         </div>
      </section>
    </main>
  </div>
  
  <!-- Template for custom select -->
  <template id="serviceCardTemplate">
    <div class="service-card">
      <div class="service-info">
        <img class="service-icon" src="" alt="Icon">
        <span class="service-name">Service Name</span>
      </div>
      <div class="custom-select" tabindex="0">
        <div class="select-trigger">
          <div class="selected-display">
             <img src="../../assets/images/default_avatar.png" alt="Avatar" class="avatar">
             <div class="details">
               <span class="name">Memuat...</span>
             </div>
          </div>
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="custom-options">
          <!-- Options -->
        </div>
      </div>
    </div>
  </template>

  <script src="../js/options.js"></script>
</body>
</html>
